name: Family Schedule Bot

on:
  schedule:
    # Утренний запуск уехал на VPS-крон (22.09.2026): расписание GitHub
    # дрейфует на часы, сообщение приходило не вовремя. Здесь остались
    # только те, где дрейф не критичен.
    - cron: '0 17 * * *'   # Вечер 20:00 MSK - благодарность
    - cron: '0 16 * * 5'   # Пятница 19:00 MSK - игры
    - cron: '0 7 * * 0'    # Воскресенье 10:00 MSK - Большая Уборка
    - cron: '0 15 * * 6'   # Суббота 18:00 MSK - напоминание про уборку завтра
    - cron: '0 14 * * *'   # Ежедневно 17:00 MSK - случайное напоминание
  workflow_dispatch:
    inputs:
      mode:
        description: 'Что отправить'
        required: false
        default: 'morning'
        type: choice
        options: [morning, gratitude, games, cleaning, cleaning_tomorrow, this_day]

jobs:
  send-morning-notification:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'morning'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install aiohttp
          fi
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py morning

  send-gratitude-reminder:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event.schedule == '0 17 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'gratitude')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install aiohttp
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py gratitude

  send-games-reminder:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event.schedule == '0 16 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'games')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install aiohttp
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py games

  send-cleaning-reminder:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event.schedule == '0 7 * * 0' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'cleaning')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install aiohttp
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py cleaning

  send-cleaning-tomorrow:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event.schedule == '0 15 * * 6' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'cleaning_tomorrow')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install aiohttp
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notifier.py cleaning_tomorrow

  send-this-day-in-history:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    if: github.event.schedule == '0 14 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'this_day')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install aiohttp
      
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python notifier.py this_day
